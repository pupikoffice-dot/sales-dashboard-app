# After merging beta → main with a "Promote beta vX.Y …" commit:
# 1. Set Supabase app_runtime_config.active_version (production header badge)
# 2. Bump beta branch product line to X.(Y+1) for the next iteration
#
# Required repo secrets:
#   SUPABASE_URL
#   SUPABASE_SERVICE_ROLE_KEY

name: Promote production version

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      promote_version:
        description: 'Product version to set (e.g. 2.1). Leave empty to parse from last promote commit.'
        required: false
        type: string

jobs:
  promote:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'Promote beta v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync production active_version in Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          PROMOTE_VERSION: ${{ github.event.inputs.promote_version }}
        run: node scripts/sync-production-version.mjs

      - name: Checkout beta and bump product line
        if: github.event_name == 'push'
        env:
          GITHUB_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          git fetch origin beta
          git checkout beta
          node scripts/bump-beta-product-version.mjs
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/lib/appChannel.ts
          git diff --staged --quiet || git commit -m "Bump beta product line after promote."
          git push origin beta
